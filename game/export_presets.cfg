html/head_include="<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover'><style>html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style><script>if(/[?&]frame_id=/.test(location.search)){var d=document.createElement('script');d.type='module';d.src='discord-bridge.js';document.head.appendChild(d);}</script><script>window.deadnightGamepad=function(){var r={};try{r.iframe=window.top!==window}catch(e){r.iframe=true}try{r.focus=document.hasFocus()}catch(e){r.focus=null}try{var f=document.permissionsPolicy||document.featurePolicy;r.policy=f?f.allowsFeature('gamepad'):null}catch(e){r.policy=null}try{var p=navigator.getGamepads();r.pads=0;for(var i=0;i<p.length;i++){if(p[i]){r.pads++}}}catch(e){r.error=e.name}return JSON.stringify(r)}</script><script>document.addEventListener('contextmenu',function(e){e.preventDefault()});document.addEventListener('gesturestart',function(e){e.preventDefault()});</script>"
