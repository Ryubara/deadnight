name: leak-probe2
on:
  push:
    branches: [exit-leak-dump]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        group: [ui, night, rules, player, weapons, misc]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/deadnight
          persist-credentials: false
          lfs: true # models, textures and sounds are LFS objects: without them Godot imports pointer files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryubara/gdstudio
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Every committed script has its committed uid
        # Before the import: an import writes missing uids to disk, and the check reads the git index anyway.
        run: python3 repos/deadnight/tools/check_gd_uids.py --root repos/deadnight
      - name: Every texture import keeps palettes exact and Detect 3D off
        # Before the import as well: the committed .import files are what the maintainer's editor reads (issue #441).
        run: python3 repos/deadnight/tools/check_texture_imports.py --root repos/deadnight
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Run the main scene
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --quit-after 60 2>&1 | tee run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log

      - name: Run each group of test folders twice with --verbose
        run: |
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          case "${{ matrix.group }}" in
            ui) dirs="ui" ;;
            night) dirs="night" ;;
            rules) dirs="rules" ;;
            player) dirs="player character dev art test_main_scene.gd" ;;
            weapons) dirs="weapons zombies" ;;
            misc) dirs="core grenades world net challenges" ;;
          esac
          args=""
          for d in $dirs; do args="$args -a res://tests/$d"; done
          for rep in 1 2; do
            "$godot" --headless --path repos/deadnight/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd $args -c --ignoreHeadlessMode --verbose > rep$rep.log 2>&1 || true
            echo "rep $rep: $(grep -a -c -E 'leaked at exit|still in use' rep$rep.log) leak lines, $(grep -a 'Overall Summary' rep$rep.log | sed 's/\x1b\[[0-9;]*m//g')"
            grep -a -E "Leaked instance|Resource still in use|leaked at exit|still in use" rep$rep.log | sed 's/\x1b\[[0-9;]*m//g' | head -20
          done
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe2-${{ matrix.group }}
          path: |
            rep1.log
            rep2.log
          if-no-files-found: warn
