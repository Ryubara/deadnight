# Deadnight's build and tests with the same pinned Godot agents use: the runner's work folder becomes a GDStudio
# workspace, the kit's `gds workspace init` fetches Godot from tools.toml (hash-checked, cached), and the project is
# imported and run headless. Any engine or script error fails the job, since Godot itself exits 0 on most of them.
# The `web` job exports the game for the browser and runs it in headless Chromium (docs/research/web-export.md).
# The `deploy` job, on main only, publishes that same build to Railway (docs/research/web-export.md, "Playing the web
# build"). `build-ok` is the required check for the build, so the jobs above it can change freely.
#
# What starts per push (the runners are the bottleneck, #447): `conventions` is the first job and also says which parts
# of the repository the pull request touches (.github/scripts/ci_scope.py). `godot` and `web` wait for it and start only
# when something they can see changed (no documentation-only run; no web build for a change that only adds tests); `mkdocs`, `markdownlint` and `actionlint` start only when their files
# changed. A job skipped by an `if` reports success to a required check, so every required name is still reported;
# `build-ok` fails on a failed or cancelled job and on a `conventions` that failed (which also stops the long jobs).
# The `backend` job runs the platform backend's own tests beside them (docs/research/ci-jobs.md).
# Actions are pinned to a full commit SHA; the tag is in the comment beside it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # redeploys the web build of main's head without a push

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group and a superseded run is cancelled. Each push to main gets its own group (its
  # commit): GitHub keeps one pending run per group and cancels the older pending one even without cancel-in-progress,
  # so a shared group lost the checks of merges that landed while another run was going (#290, #329).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    # The conventions file must stay well formed and the generated files (the pull request template and the issue
    # forms) must match it. It runs first, takes seconds, and its `scope` step decides which of the jobs below start:
    # on a pull request from the files it changes (the API, so no checkout of more than the base is needed), on a push to
    # the default branch or a manual run everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      godot: ${{ steps.scope.outputs.godot }}
      web: ${{ steps.scope.outputs.web }}
      docs: ${{ steps.scope.outputs.docs }}
      markdown: ${{ steps.scope.outputs.markdown }}
      workflows: ${{ steps.scope.outputs.workflows }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --with pyyaml python .github/scripts/groundwork.py validate
      - run: uv run --with pyyaml python .github/scripts/groundwork.py render --check
      - run: uv run --with pyyaml python .github/scripts/groundwork.py check-files
      - name: The web deploy script refuses a branch other than main
        run: bash deploy/web/test_deploy.sh
      - name: The deploy jobs refuse a build older than the live one and deploy a newer one
        run: bash deploy/test_check_head.sh
      - name: The Discord bridge's share half refuses nothing it could have asked for first
        # A client that wants `authenticate` before any command (RPC 4006 otherwise, #627); no packages, node is on the runner.
        run: node --test deploy/web/test_discord_share.mjs
      - name: Which parts of the repository the change touches
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_scope.py --self-test
          if [ "$EVENT" = pull_request ]; then
            [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "unexpected pull request number" >&2; exit 1; }
            gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" --jq '.[].filename' | python3 .github/scripts/ci_scope.py | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_scope.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  godot:
    needs: conventions
    if: needs.conventions.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    # The suite is split over six parallel jobs by test folder and heavy script (tools/ci_test_shards.py; one job took
    # 15 to 20 minutes, #524; three took 12 to 15 each, #775): each shard takes about 7 minutes (about 6 of suites, one
    # of setup), and the limit is twice that. The jobs are `godot (1)` to `godot (6)`;
    # `build-ok` waits for all of them and is the one required name, so the ruleset does not list them.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/deadnight
          persist-credentials: false
          lfs: true # models, textures and sounds are LFS objects: without them Godot imports pointer files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryubara/gdstudio
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the platform backend's packages
        # The lobby's real-socket test runs the backend (spikes/backend) beside a game server; without these it skips.
        run: npm ci --prefix repos/deadnight/spikes/backend
      - name: Every committed script has its committed uid
        # Before the import: an import writes missing uids to disk, and the check reads the git index anyway.
        run: python3 repos/deadnight/tools/check_gd_uids.py --root repos/deadnight
      - name: Every texture import keeps palettes exact and Detect 3D off
        # Before the import as well: the committed .import files are what the maintainer's editor reads (issue #441).
        run: python3 repos/deadnight/tools/check_texture_imports.py --root repos/deadnight
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Run the main scene
        # Once per run, not per shard: the same project, the same engine.
        if: matrix.shard == 1
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --quit-after 60 2>&1 | tee run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log

      - name: Play a night headless
        if: matrix.shard == 1
        # A night builds the rules, the servers and the sounds; Godot prints a leak as a warning and an ERROR at exit,
        # after the game itself has finished, so only the log shows it.
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --verbose --path repos/deadnight/game res://tests/captures/autopilot_night.tscn -- --rounds=1 --speed=40 2>&1 | tee night.log
          grep -q "^REPORT" night.log
          ! grep -E "^(SCRIPT )?ERROR|leaked at exit|still in use" night.log

      - name: Run the tests (GdUnit4), this shard's folders
        # No `-d`: with the debugger attached, the first script error stops the engine at a prompt and the job hangs.
        # `--ignoreHeadlessMode` is needed because GdUnit4 otherwise refuses to run headless; the report folder is
        # uploaded below even when a test fails.
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          python3 repos/deadnight/tools/ci_test_shards.py --root repos/deadnight/game --self-test
          read -r -a folders < <(python3 repos/deadnight/tools/ci_test_shards.py --root repos/deadnight/game --shard "${{ matrix.shard }}")
          echo "shard ${{ matrix.shard }}: ${folders[*]}"
          "$godot" --headless --path repos/deadnight/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd "${folders[@]}" -c --ignoreHeadlessMode --verbose 2>&1 | tee tests.log
          # Godot prints a leak after the run has finished, so only the log shows it (see the night step).
          ! grep -E "leaked at exit|still in use" tests.log
      - name: List what leaked at exit
        # `--verbose` (night and test steps) makes the engine name each leaked instance and resource; this keeps just
        # those lines, so a failed leak check says which objects it was (issue #487).
        if: always()
        run: grep -h -E "leaked at exit|still in use|Leaked instance|Resource still in use" night.log tests.log > leaks.txt || true
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report-${{ matrix.shard }}
          path: |
            repos/deadnight/game/reports
            tests.log
            night.log
            leaks.txt
          if-no-files-found: warn

  bots-soak:
    # Bots in a room (#230): a game server's room over a real WebSocket, autopilot clients as the people, ten game
    # minutes (about three of wall time at a fixed frame rate). `pair` keeps two people and two bots; `churn` has people
    # join and leave so the bots give way and come back. It fails on an engine error, on a divergence the soak checks for
    # (a predicted body far from the server's, a seat a client shows that the server does not hold, a night rebuilt, a
    # round that goes back, a bot count off the rule) and on a missing report.
    needs: conventions
    if: needs.conventions.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [pair, churn]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/deadnight
          persist-credentials: false
          lfs: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryubara/gdstudio
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Play ten minutes in a room with bots
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --verbose --path repos/deadnight/game res://tests/captures/bots_slots_soak.tscn --fixed-fps 60 -- --scenario=${{ matrix.scenario }} --minutes=10 2>&1 | tee soak.log
          grep -q "^SLOTS {" soak.log
          ! grep -E "^(SCRIPT )?ERROR|leaked at exit|still in use|^SLOTS FAIL" soak.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bots-soak-${{ matrix.scenario }}
          path: soak.log
          if-no-files-found: warn

  web:
    needs: conventions
    if: needs.conventions.outputs.web == 'true'
    # The web export, in a browser. Godot exports with the pinned templates (tools.toml `godot-templates`, hash-checked by
    # `gds workspace init`, about 1 GB, so the download cache matters), the build is served by tools/web_smoke/smoke.py,
    # and headless Chromium (Playwright) reaches the main menu and the wardrobe, starts a night and plays it a while.
    # Any console error, page error or failed request fails the job. The export has no threads (preset option
    # `variant/thread_support=false`), so the page needs no cross-origin isolation headers, which a Discord Activity
    # cannot send anyway. Frame times on a runner come from a software renderer: recorded in the artifact, never gated.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/deadnight
          persist-credentials: false
          lfs: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryubara/gdstudio
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-web-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and its export templates
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,godot-templates
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/deadnight/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Export the web build
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          mkdir -p repos/deadnight/build/web
          "$godot" --headless --path repos/deadnight/game --export-release Web 2>&1 | tee export.log
          if grep -E "ERROR" export.log; then exit 1; fi
          test -s repos/deadnight/build/web/index.pck
          # The JSON catalogues are read as plain files: without `*.json` in the export filter they are missing.
          for name in parts.json clips.json zombies.json; do grep -aq "$name" repos/deadnight/build/web/index.pck; done
      - name: Install the browser
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium-headless-shell
      - name: Open the build in a browser
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/smoke.py repos/deadnight/build/web smoke
      - name: Count the bridge calls of a plain page
        # A player's page opens no probe: the menu and a night the autopilot plays cross the JavaScript bridge about never (#935).
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/bridge_calls.py repos/deadnight/build/web smoke/bridge-calls --max-per-second 20
      - name: Lose the pointer lock in the browser
        # The browser's first Esc frees the lock and never reaches the page: the night's menu must open at once (#476).
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/pointer_lock.py repos/deadnight/build/web smoke/pointer-lock
      - name: Press Start on a virtual gamepad in the browser
        # Start is `pause` and `ui_accept`: the night must pause and resume on it, and the pad must play with no mouse lock (#494).
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/pad_pause.py repos/deadnight/build/web smoke/pad-pause
      - name: Look through the person in a night with 3 bots in the browser
        # A bot's body must never hold the current camera: the probe's `view_is_players` stays true for a night with 3 bots (#702).
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/camera_owner.py repos/deadnight/build/web smoke/camera-owner
      - name: Tour the skin shaders in the browser
        # The menu, the three transitions and the credits: fails on a console error or an all-black or all-white frame.
        run: uv run --with playwright==1.64.1 --with pillow python repos/deadnight/tools/web_smoke/skin_tour.py repos/deadnight/build/web smoke/skin-tour --size 1280x720 --hold-ms 500
      - name: Start every web probe's menu path
        # The menu paths the probes in tools/web_smoke walk (Loadout, Play together, settings, Solo, the ?dev join screen)
        # through their shared helpers, once: a menu change that breaks one fails here, not the next time a probe is run.
        run: uv run --with playwright==1.64.1 python repos/deadnight/tools/web_smoke/startup_check.py repos/deadnight/build/web smoke/startup-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the platform backend's packages
        # The Discord probe below runs the backend (spikes/backend) with the stub sign-in.
        run: npm ci --prefix repos/deadnight/spikes/backend
      - name: Share in Discord, through the real SDK and a client that wants authenticate first
        # The bridge as the web image bundles it, the real Embedded App SDK, and a page that answers as Discord's client
        # does: 4006 for every command until the Activity authenticated (#627). The sign-in must reach the lobby's
        # share window; a refused token and a refused sign-in must say the Activity is not signed in.
        run: |
          for mode in strict reject-token refuse-authorize; do
            uv run --with playwright==1.64.1 --with cryptography python repos/deadnight/tools/web_smoke/activity.py repos/deadnight/build/web - "smoke/discord-share-$mode" --embed plain --share --real-bridge --local-backend --host-mode "$mode"
          done
      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: repos/deadnight/build/web
          if-no-files-found: warn
      - name: Upload the browser run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-smoke
          path: |
            smoke
            export.log
          if-no-files-found: warn

  deploy:
    # Publishes the build `web` just exported and smoke-tested to the Railway service `web` (a Caddy container, see
    # deploy/web/), so the game at its public URL is the newest green commit of main. Only main gets here: a pull request, and
    # a fork's run, has no secret. The project token (a Railway project token for gdstudio-net-test, environment
    # production) is the repository secret RAILWAY_TOKEN; without it the job warns and stops, it does not fail.
    # Railway CLI pinned to the version the deploy was tested with.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [godot, web]
    # One deploy at a time, so the check below reads what the service runs after the deploy before this one finished.
    # GitHub keeps one waiting job per group: a waiting deploy is replaced by a newer waiting one, and a build is
    # deployed whenever it is newer than the live one, so the last green commit ends up live (#732).
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check the deploy token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning title=Not deployed::The repository secret RAILWAY_TOKEN is not set (docs/research/web-export.md)."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - if: env.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          fetch-depth: 0 # the check asks whether one commit is an ancestor of another
      - if: env.skip != 'true'
        run: npm install --global @railway/cli@5.63.1
      - name: Skip a build that is older than the one the service runs
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/check_head.sh "$GITHUB_SHA" web || { test $? = 3 && echo "skip=true" >> "$GITHUB_ENV"; }
      - if: env.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: build/web
      - name: Deploy and wait for the health check
        if: env.skip != 'true'
        run: bash deploy/web/deploy.sh build/web "$GITHUB_SHA"

  deploy-server:
    # Publishes the game server of main's head to the Railway service `deadnight-server` (deploy/server/), so a client
    # of the web build above always finds a server that speaks its protocol (the version is checked in the hello, and a
    # server a version behind turns every player away). It builds from the `godot` job's tested commit, with LFS files,
    # since the server imports the whole project. Same token and same skip as `deploy`.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [godot]
    # One deploy at a time, like `deploy`: the check below reads the live commit when this job starts, after its wait.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check the deploy token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning title=Server not deployed::The repository secret RAILWAY_TOKEN is not set (docs/research/web-export.md)."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - if: env.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          fetch-depth: 0 # the check asks whether one commit is an ancestor of another
          path: head-check
      - if: env.skip != 'true'
        run: npm install --global @railway/cli@5.63.1
      - name: Skip a build that is older than the one the service runs
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # run inside the checkout: the check reads its history
        working-directory: head-check
        run: bash deploy/check_head.sh "$GITHUB_SHA" deadnight-server || { test $? = 3 && echo "skip=true" >> "$GITHUB_ENV"; }
      - if: env.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Deploy and wait until the server is live
        if: env.skip != 'true'
        run: bash deploy/server/deploy.sh deadnight-server

  backend:
    # The platform backend's own tests (spikes/backend, `npm test`: the lobby, presence, ticket and save rules), which no
    # other job runs: `godot` only installs the packages so the lobby's real-socket test can start the backend (#558).
    # It runs beside `godot` and `web`, not before them, so the critical path stays the Godot shards; it takes about a
    # minute. It starts when the backend (or this workflow) changed, and on main (.github/scripts/ci_scope.py). A real
    # Postgres service runs the two store tests that skip without TEST_DATABASE_URL.
    needs: conventions
    if: needs.conventions.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: deadnight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deadnight_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: spikes/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: spikes/backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spikes/backend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: The backend's tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/deadnight_test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          # A skipped Postgres test would mean the service was not reached: the suite then proved less than it says.
          ! grep -E "^.* skipped [1-9][0-9]*$" test.log

  mkdocs:
    # The documentation site built strictly (a broken link or a page missing from the nav fails). A pull request that
    # changes no page, no `mkdocs.yml` and no Markdown file skips it; the push to the default branch builds and
    # publishes the site in docs.yml.
    needs: conventions
    if: github.event_name == 'pull_request' && needs.conventions.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  markdownlint:
    needs: conventions
    if: needs.conventions.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rules are in .markdownlint.yaml; the files skipped in .markdownlint-cli2.yaml.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #.venv
            #site

  actionlint:
    needs: conventions
    if: needs.conventions.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The download script comes from the same commit as the release it fetches (v1.7.12).
      - name: Download actionlint 1.7.12
        run: >-
          bash <(curl -sSfL
          https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          1.7.12
      - run: ./actionlint -color .github/workflows/*.yml

  build-ok:
    if: always()
    needs: [conventions, godot, bots-soak, web, backend]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        # A skipped `godot`, `web` and `backend` (a documentation-only change) are fine; a skipped one after a failed
        # `conventions` is not, and that failure is in the list.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
